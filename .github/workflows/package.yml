# حزمة التحميل: بعد كل دفعة إلى main تُبنى نسخة مضغوطة من تطبيق الويب
# وتُنشر إصداراً باسم «latest» ، ويُحدَّث مجلد التحميل برابطها المباشر وتاريخها.
#
# لماذا إصدار لا ملفاً داخل المستودع؟ حجم الحزمة نحو ٨٠ ميجابايت (صور الأمثلة وملفات pdf.js) ،
# ولو رُفعت مع كل دفعة لتضخّم تاريخ المستودع بسرعة حتى يتعذّر استنساخه. الإصدارات لا تدخل
# التاريخ ، والرابط ثابت لا يتغيّر ، فيبقى «آخر تحديث» متاحاً دائماً بالنقر نفسه.
name: بناء حزمة التحميل

on:
  push:
    branches: [main]
    paths-ignore:
      - 'تحميل-نسخة-الهاتف-أو-التاب/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ضغط تطبيق الويب
        run: |
          cd 'تحضير-ويب-سريع'
          zip -r -q '../دفتر-التحضير.zip' . -x 'tools/*' -x '*.pdf' -x '*.daftar'
          cd ..
          echo "SIZE=$(du -h 'دفتر-التحضير.zip' | cut -f1)" >> "$GITHUB_ENV"

      - name: نشر الإصدار
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest 'دفتر-التحضير.zip' \
            --title 'آخر نسخة من دفتر التحضير' \
            --notes "بُنيت تلقائياً من الدفعة ${GITHUB_SHA::7} بتاريخ $(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: تحديث بطاقة مجلد التحميل
        run: |
          mkdir -p 'تحميل-نسخة-الهاتف-أو-التاب'
          LINK='https://github.com/AY2009MN/tahdeeri/releases/latest/download/دفتر-التحضير.zip'
          {
            echo "# تحميل نسخة الهاتف أو التاب"
            echo
            echo "## ⬇️ [نزّل آخر نسخة]($LINK)"
            echo
            echo "الرابط ثابت ويشير دائماً إلى آخر تحديث ـ لا يتغيّر مهما تكرّر البناء."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| آخر تحديث | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| الدفعة | \`${GITHUB_SHA::7}\` |"
            echo "| الحجم | ${SIZE} |"
            echo
            echo "## كيف تُثبّته"
            echo
            echo "**الأسهل ـ بلا تحميل:** افتح <https://ay2009mn.github.io/tahdeeri/> ثم من قائمة"
            echo "المتصفح اختر «إضافة إلى الشاشة الرئيسية» ، فيعمل كتطبيق بلا إنترنت ويحدّث نفسه تلقائياً."
            echo
            echo "**نسخة محلّية:** نزّل الملف المضغوط وفُكّ ضغطه ، ثم على الحاسوب شغّل"
            echo "\`تشغيل التطبيق.cmd\` داخل المجلد."
            echo
            echo "> لا تفتح \`index.html\` بنقرة مزدوجة: المتصفح يمنع التخزين مع عناوين \`file://\` ،"
            echo "> فيعمل التطبيق للعرض والطباعة فقط بلا حفظ."
          } > 'تحميل-نسخة-الهاتف-أو-التاب/README.md'
          rm -f 'تحميل-نسخة-الهاتف-أو-التاب/دفتر-التحضير.zip'

      - name: دفع البطاقة
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A 'تحميل-نسخة-الهاتف-أو-التاب'
          git diff --staged --quiet && echo 'لا جديد' && exit 0
          git commit -m "حزمة التحميل: تحديث تلقائي ${GITHUB_SHA::7}"
          git push
