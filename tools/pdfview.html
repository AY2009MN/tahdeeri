<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>أداة تطوير: عرض وقصّ</title>
<style>
body{margin:0;background:#333;font-family:Tahoma}
#bar{position:fixed;top:0;left:0;right:0;background:#111;color:#fff;padding:4px 8px;font-size:12px;z-index:9}
#wrap{margin-top:26px;position:relative;display:inline-block}
canvas{display:block}
</style></head><body>
<div id="bar"></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script type="module">
/* أداة تطوير مؤقتة (غير منشورة):
   ?f=ملف&p=صفحة&w=عرض_العرض   ← يعرض الصفحة بعرض محدّد لقراءتها بلقطة شاشة
   window.crop(f,p,[x0,y0,x1,y1] بنسب ٠..١ ,name) ← يقصّ بدقّة عالية ويفرّغ الخلفية ويحفظ في img/ */
import * as lib from '../vendor/pdf.mjs';
lib.GlobalWorkerOptions.workerSrc = '../vendor/pdf.worker.mjs';
const q = new URLSearchParams(location.search);
const docs = {};
// نجلب الملف كاملاً بأنفسنا ثم نمرّره بيانات ، فلا تتدخّل طلبات المدى أو عارض المتصفح
const open = f => docs[f] ||= fetch('/__b64/' + encodeURIComponent(f)).then(async r => {
  if (!r.ok) throw new Error('HTTP ' + r.status + ' لـ ' + f);
  const txt = await r.text();
  if (!txt.length) throw new Error('نصّ فارغ لـ ' + f);
  const bin = atob(txt), data = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
  return data;
}).then(data => lib.getDocument({ data,
  cMapUrl: '../vendor/cmaps/', cMapPacked: true, standardFontDataUrl: '../vendor/standard_fonts/',
  disableFontFace: q.get('ff') !== '1', useSystemFonts: false, fontExtraProperties: true }).promise);

async function renderTo(cv, f, p, width) {
  const doc = await open(f);
  const page = await doc.getPage(p);
  const vp0 = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: width / vp0.width });
  cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: cx, viewport: vp }).promise;
  return doc.numPages;
}

async function show() {
  const f = q.get('f'), p = +(q.get('p') || 1), w = +(q.get('w') || 1000);
  if (!f) return;
  const n = await renderTo(document.getElementById('cv'), f, p, w);
  document.getElementById('bar').textContent = `${f} — ص ${p} / ${n}`;
  // شبكة إرشادية كل ١٠٪ لتحديد الإحداثيات بدقّة
  const cv = document.getElementById('cv'), cx = cv.getContext('2d');
  cx.save(); cx.strokeStyle = 'rgba(255,0,0,.35)'; cx.fillStyle = 'rgba(255,0,0,.8)'; cx.font = '11px Tahoma';
  if (q.get('grid') !== '0') for (let i = 1; i < 20; i++) {
    const x = cv.width * i / 20, y = cv.height * i / 20;
    cx.lineWidth = i % 2 ? .5 : 1;
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, cv.height); cx.stroke();
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(cv.width, y); cx.stroke();
    if (i % 2 === 0) { cx.fillText(String(i * 5), x + 2, 12); cx.fillText(String(i * 5), 2, y - 2); }
  }
  cx.restore();
}

function clean(cv) {
  const cx = cv.getContext('2d');
  const im = cx.getImageData(0, 0, cv.width, cv.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const mn = Math.min(d[i], d[i+1], d[i+2]), mx = Math.max(d[i], d[i+1], d[i+2]);
    if (mn >= 244 && mx - mn <= 10) d[i+3] = 0;
    else if (mn >= 228 && mx - mn <= 12) d[i+3] = Math.round(255 - ((mn - 228) / 16) * 255);
  }
  cx.putImageData(im, 0, 0);
  // قصّ الحواف الشفافة
  let t = cv.height, l = cv.width, r = 0, b = 0;
  for (let y = 0; y < cv.height; y++) for (let x = 0; x < cv.width; x++)
    if (d[(y * cv.width + x) * 4 + 3] > 20) { if (y < t) t = y; if (y > b) b = y; if (x < l) l = x; if (x > r) r = x; }
  if (r <= l || b <= t) return cv;
  const pad = 6, o = document.createElement('canvas');
  o.width = r - l + 1 + pad * 2; o.height = b - t + 1 + pad * 2;
  o.getContext('2d').drawImage(cv, l, t, r - l + 1, b - t + 1, pad, pad, r - l + 1, b - t + 1);
  return o;
}

window.crop = async (f, p, box, name, keepBg) => {
  const full = document.createElement('canvas');
  await renderTo(full, f, p, 2000);
  // box : مستطيل [x0,y0,x1,y1] أو مضلّع [[x,y],...] بنسب ٠..١ من الصفحة
  const poly = Array.isArray(box[0]) ? box : null;
  const xs = poly ? poly.map(p => p[0]) : [box[0], box[2]];
  const ys = poly ? poly.map(p => p[1]) : [box[1], box[3]];
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const c = document.createElement('canvas');
  c.width = Math.round((x1 - x0) * full.width); c.height = Math.round((y1 - y0) * full.height);
  const cc = c.getContext('2d');
  if (poly) {
    cc.beginPath();
    poly.forEach(([x, y], i) => cc[i ? 'lineTo' : 'moveTo']((x - x0) * full.width, (y - y0) * full.height));
    cc.closePath(); cc.clip();
  }
  cc.drawImage(full, Math.round(x0 * full.width), Math.round(y0 * full.height), c.width, c.height, 0, 0, c.width, c.height);
  let out = keepBg ? c : clean(c);
  if (out.width > 1400) {
    const s = document.createElement('canvas'); s.width = 1400; s.height = Math.round(out.height * 1400 / out.width);
    s.getContext('2d').drawImage(out, 0, 0, s.width, s.height); out = s;
  }
  const blob = await new Promise(r => out.toBlob(r, 'image/png'));
  const res = await fetch('/__save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
  return `${name}: ${res.status} ${out.width}x${out.height}`;
};

/* تشغيل دفعة قصّ في الخلفية مع سجلّ تقدّم: window.__log */
{
  const orig = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = cb => document.hidden ? setTimeout(() => cb(performance.now()), 0) : orig(cb);
}
window.__log = [];
window.runJobs = (F, jobs) => {
  (async () => {
    for (const [p, b, n, keep] of jobs) {
      try { window.__log.push(await crop(F, p, b, n, keep)); }
      catch (e) { window.__log.push('ERR ' + n + ' ' + e.message); }
    }
    window.__log.push('DONE');
  })();
  return 'started ' + jobs.length;
};

/* تشغيل آلي من متصفح بلا واجهة: ?run=jobs-file.json  (الملف داخل tools/) */
if (q.get('run')) {
  (async () => {
    document.title = 'RUNNING';
    const spec = await (await fetch(q.get('run') + '?t=' + Date.now())).json();
    const log = [];
    for (const j of spec) {
      try {
        if (j.view) {                                   // صفحة كاملة بشبكة إحداثيات للمعاينة
          const cv = document.createElement('canvas');
          await renderTo(cv, j.f, j.p, j.w || 900);
          const cx = cv.getContext('2d');
          cx.font = 'bold 14px Tahoma';
          for (let i = 5; i < 100; i += 5) {
            const x = cv.width * i / 100, y = cv.height * i / 100;
            cx.strokeStyle = i % 10 ? 'rgba(255,0,0,.16)' : 'rgba(255,0,0,.42)'; cx.lineWidth = 1;
            cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, cv.height); cx.stroke();
            cx.beginPath(); cx.moveTo(0, y); cx.lineTo(cv.width, y); cx.stroke();
            if (i % 10 === 0) {
              cx.fillStyle = 'rgba(210,0,0,.95)';
              cx.fillText(i, x + 2, 14); cx.fillText(i, x + 2, cv.height - 3);
              cx.fillText(i, 2, y - 2); cx.fillText(i, cv.width - 22, y - 2);
            }
          }
          const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
          const name = `${j.f.replace(/\W+/g, '_')}_${j.p}.png`;
          await fetch('/__save?dir=views&name=' + name, { method: 'POST', body: blob });
          log.push(name);
        } else {
          log.push(await crop(j.f, j.p, Array.isArray(j.box[0]) ? j.box.map(v => v.map(n => n / 100)) : j.box.map(n => n / 100), j.name, j.keep));
        }
      } catch (e) { log.push('ERR ' + (j.name || j.p) + ' ' + e.message); }
    }
    await fetch('/__save?dir=views&name=' + (q.get('done') || 'done') + '.txt', { method: 'POST', body: log.join('\n') });
    document.getElementById('bar').textContent = log.join(' | ');
    document.title = 'DONE';
  })();
}

/* معاينة قصاصة محفوظة أو مقترحة فوق الصفحة */
window.preview = (box) => {
  const cv = document.getElementById('cv'), cx = cv.getContext('2d');
  const [x0, y0, x1, y1] = box;
  cx.save(); cx.strokeStyle = '#00a'; cx.lineWidth = 3;
  cx.strokeRect(x0 * cv.width, y0 * cv.height, (x1 - x0) * cv.width, (y1 - y0) * cv.height); cx.restore();
};
show();
</script>
</body></html>
